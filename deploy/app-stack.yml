# =============================================================================
# TrueNAS Custom App — Flask PDF to Word Converter
#
# Deploy this as a Custom App on TrueNAS Scale:
#   TrueNAS UI → Apps → Discover Apps → Custom App
#   → Switch to YAML mode → paste this file
#   → Application Name: flask-pdf-to-word
#
# Prerequisites:
#   1. Allow the insecure private registry on TrueNAS (run once via SSH):
#        cat > /etc/docker/daemon.json << 'EOF'
#        { "insecure-registries": ["<TRUENAS_IP>:<REGISTRY_PORT>"] }
#        EOF
#        systemctl restart docker
#
#   2. Log in to the private registry from TrueNAS (run once via SSH):
#        docker login <TRUENAS_IP>:<REGISTRY_PORT>
#      Enter the registry username and password when prompted.
#      Credentials are saved to /root/.docker/config.json and reused automatically.
#
#   3. The image must already exist in your private registry.
#      Manual first-time push (SSH into TrueNAS):
#        cd /tmp
#        git clone https://github.com/kingtvarshin/pdf-to-word-converter.git
#        cd pdf-to-word-converter
#        docker build -t <TRUENAS_IP>:<REGISTRY_PORT>/flask-pdf-to-word-app:latest .
#        docker push <TRUENAS_IP>:<REGISTRY_PORT>/flask-pdf-to-word-app:latest
#
#   3. Replace <your-pool> in the volumes section with your actual pool name.
#
#   4. Secret configuration (.env) — NEVER commit secrets to git.
#      The Jenkins pipeline writes the production .env file to:
#        /mnt/<YOUR_POOL>/pdf-app/.env
#      on TrueNAS using the 'app-env-file' Secret File credential.
#      That file is then loaded by Docker Compose's env_file directive below.
#
#      Required .env keys (see flask-pdf-to-word-app/.env.example):
#        SECRET_KEY=<long-random-string>   # Flask session signing key
#        FLASK_DEBUG=false
#        PORT=5123
#        MAX_UPLOAD_MB=50
#        UPLOAD_FOLDER=uploads
#        OUTPUT_FOLDER=outputs
#
#      First-time setup (manual, run once):
#        ssh root@<TRUENAS_IP>
#        mkdir -p /mnt/<YOUR_POOL>/pdf-app
#        cat > /mnt/<YOUR_POOL>/pdf-app/.env << 'EOF'
#        SECRET_KEY=<generate with: python3 -c "import secrets; print(secrets.token_hex(32))">
#        FLASK_DEBUG=false
#        PORT=5123
#        MAX_UPLOAD_MB=50
#        UPLOAD_FOLDER=uploads
#        OUTPUT_FOLDER=outputs
#        EOF
#        chmod 600 /mnt/<YOUR_POOL>/pdf-app/.env
# =============================================================================

services:

  flask-pdf-to-word-app:
    image: <TRUENAS_IP>:<REGISTRY_PORT>/flask-pdf-to-word-app:latest
    restart: unless-stopped
    ports:
      - "5123:5123"
    # Load secrets and config from a file that lives on the host (not in git).
    # Jenkins writes this file to TrueNAS on every deploy via the app-env-file
    # Secret File credential. Values here override any matching keys in env_file.
    env_file:
      - /mnt/<YOUR_POOL>/pdf-app/.env
    environment:
      # Non-secret overrides — safe to commit.
      FLASK_DEBUG: "false"
      PORT: "5123"
      MAX_UPLOAD_MB: "50"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"   # tells Watchtower to monitor this container
    volumes:
      # Persist uploaded and converted files across container restarts
      - /mnt/<YOUR_POOL>/pdf-app/uploads:/app/uploads
      - /mnt/<YOUR_POOL>/pdf-app/outputs:/app/outputs
